name: Model Validation and Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull dataset with DVC
        run: dvc pull || echo "No DVC remote configured"

      - name: Train model
        run: python train.py

      - name: Export MLflow Run ID
        shell: bash
        run: |
          python <<'PY'
          import os

          if not os.path.exists("run_id.txt"):
              raise FileNotFoundError("run_id.txt was not created by train.py")

          with open("run_id.txt", "r") as f:
              run_id = f.read().strip()

          with open("model_info.txt", "w") as f:
              f.write(run_id)

          print(f"Saved Run ID to model_info.txt: {run_id}")
          PY

      - name: Upload model info artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt

      - name: Upload MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns

  deploy:
    runs-on: ubuntu-latest
    needs: validate

    env:
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install MLflow
        run: |
          pip install --upgrade pip
          pip install mlflow

      - name: Download model info artifact
        uses: actions/download-artifact@v4
        with:
          name: model-info

      - name: Download MLflow runs
        uses: actions/download-artifact@v4
        with:
          name: mlruns
          path: mlruns

      - name: Check accuracy threshold
        run: python check_threshold.py

      - name: Mock Docker build
        run: echo "Building Docker image for Run ID: $(cat model_info.txt)"

      - name: Build Docker image
        run: docker build --build-arg RUN_ID=$(cat model_info.txt) -t my-model:latest .