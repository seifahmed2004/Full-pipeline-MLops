name: Model Validation and Deployment Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull dataset with DVC
        run: dvc pull --force || echo "Using repo copy of iris.csv"

      - name: Train model
        run: python train.py

      - name: Debug MLflow structure
        run: |
          echo "===== MLRUNS STRUCTURE ====="
          ls -R mlruns || echo "mlruns not found"

      - name: Archive MLflow runs
        run: tar -czf mlruns.tar.gz mlruns

      - name: Upload model info artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt

      - name: Upload MLflow archive
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-archive
          path: mlruns.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: validate

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install MLflow
        run: |
          pip install --upgrade pip
          pip install mlflow pandas

      - name: Download model info artifact
        uses: actions/download-artifact@v4
        with:
          name: model-info

      - name: Download MLflow archive
        uses: actions/download-artifact@v4
        with:
          name: mlruns-archive

      - name: Extract MLflow runs
        run: tar -xzf mlruns.tar.gz

      - name: Debug mlruns structure
        run: |
          echo "===== FINAL STRUCTURE ====="
          ls -R mlruns || echo "mlruns missing"

      - name: Check accuracy threshold
        run: python check_threshold.py

      - name: Mock Docker build
        run: |
          RUN_ID=$(python -c "import json; print(json.load(open('model_info.txt'))['run_id'])")
          echo "Building Docker image for Run ID: ${RUN_ID}"

      - name: Build Docker image
        run: |
          RUN_ID=$(python -c "import json; print(json.load(open('model_info.txt'))['run_id'])")
          docker build --build-arg RUN_ID=${RUN_ID} -t my-model:latest .